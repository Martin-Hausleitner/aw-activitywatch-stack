<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">ActivityWatch local lifelog stack architecture</title>
<desc id="desc">A local-first architecture connecting ActivityWatch, WHOOP, Apple Screen Time, email exports, launchd automation, and OpenClaw agents.</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#faf7f0"/><stop offset="1" stop-color="#edf4ef"/></linearGradient>
  <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#17324d"/><stop offset="1" stop-color="#285c7a"/></linearGradient>
  <linearGradient id="green" x1="0" x2="1"><stop stop-color="#335c43"/><stop offset="1" stop-color="#6a9c78"/></linearGradient>
  <linearGradient id="gold" x1="0" x2="1"><stop stop-color="#a66f2c"/><stop offset="1" stop-color="#d6a84f"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity=".18"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#17324d"/></marker>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0v34" fill="none" stroke="#17324d" stroke-opacity=".06" stroke-width="1"/></pattern>
</defs>
<rect width="1400" height="820" rx="36" fill="url(#paper)"/>
<rect width="1400" height="820" rx="36" fill="url(#grid)"/>
<text x="70" y="80" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="700" fill="#17324d">ActivityWatch Local Lifelog Stack</text>
<text x="72" y="122" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#516071">Local-first health, focus, recovery, and device-usage telemetry for humans and OpenClaw agents.</text>

<g filter="url(#shadow)">
  <rect x="80" y="190" width="270" height="170" rx="26" fill="#fffaf2" stroke="#d8c7a1"/>
  <text x="110" y="238" font-size="28" font-family="Georgia" fill="#17324d" font-weight="700">WHOOP</text>
  <text x="110" y="272" font-size="16" font-family="Inter" fill="#516071">OAuth API sync + future export backfill</text>
  <text x="110" y="310" font-size="14" font-family="monospace" fill="#a66f2c">sleep · workout · recovery · strain</text>

  <rect x="80" y="430" width="270" height="170" rx="26" fill="#fffaf2" stroke="#d8c7a1"/>
  <text x="110" y="478" font-size="28" font-family="Georgia" fill="#17324d" font-weight="700">Apple Screen Time</text>
  <text x="110" y="512" font-size="16" font-family="Inter" fill="#516071">Hourly dropzone import for iPhone app use</text>
  <text x="110" y="550" font-size="14" font-family="monospace" fill="#a66f2c">CSV/JSON · app · category · duration</text>

  <rect x="565" y="285" width="310" height="220" rx="34" fill="url(#blue)"/>
  <text x="620" y="348" font-size="34" font-family="Georgia" fill="#fff" font-weight="700">ActivityWatch</text>
  <text x="620" y="386" font-size="17" font-family="Inter" fill="#d9ecf8">Local timeline hub</text>
  <text x="620" y="426" font-size="14" font-family="monospace" fill="#e9d5a4">127.0.0.1:5600/api/0</text>
  <text x="620" y="462" font-size="14" font-family="monospace" fill="#d9ecf8">buckets · events · summaries</text>

  <rect x="1030" y="190" width="285" height="170" rx="26" fill="url(#green)"/>
  <text x="1060" y="238" font-size="28" font-family="Georgia" fill="#fff" font-weight="700">OpenClaw Agents</text>
  <text x="1060" y="272" font-size="16" font-family="Inter" fill="#e7f6ea">Read-only by default, privacy-aware analysis</text>
  <text x="1060" y="310" font-size="14" font-family="monospace" fill="#f5e3b1">doctor · reports · automation</text>

  <rect x="1030" y="430" width="285" height="170" rx="26" fill="url(#gold)"/>
  <text x="1060" y="478" font-size="28" font-family="Georgia" fill="#fff" font-weight="700">GitHub Stack</text>
  <text x="1060" y="512" font-size="16" font-family="Inter" fill="#fff8e8">Docs, launchd templates, checks, public skills</text>
  <text x="1060" y="550" font-size="14" font-family="monospace" fill="#fff8e8">no secrets · no exports · CI green</text>
</g>

<path d="M355 275 C450 275 470 340 560 365" fill="none" stroke="#17324d" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M355 515 C455 515 475 455 560 435" fill="none" stroke="#17324d" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M880 360 C955 320 965 270 1020 260" fill="none" stroke="#17324d" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M880 440 C955 480 965 520 1020 520" fill="none" stroke="#17324d" stroke-width="4" marker-end="url(#arrow)"/>

<rect x="78" y="680" width="1240" height="72" rx="22" fill="#17324d" opacity=".94"/>
<text x="110" y="724" font-size="21" font-family="monospace" fill="#f7ead0">python3 scripts/aw-stack-doctor.py  →  verify API, buckets, launchd, dropzones, safety</text>
</svg>
