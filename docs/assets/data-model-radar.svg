<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="540" viewBox="0 0 1400 540" role="img" aria-labelledby="title desc">
<title id="title">ActivityWatch stack data model</title>
<desc id="desc">Data model separating timeline blocks, daily metrics, private raw data, and public repository materials.</desc>
<rect width="1400" height="540" rx="34" fill="#0f1720"/>
<circle cx="700" cy="270" r="185" fill="none" stroke="#d8b56d" stroke-width="2" stroke-dasharray="8 10" opacity=".7"/>
<circle cx="700" cy="270" r="105" fill="none" stroke="#8bd3ff" stroke-width="2" stroke-dasharray="5 8" opacity=".8"/>
<circle cx="700" cy="270" r="38" fill="#d8b56d"/>
<text x="700" y="265" text-anchor="middle" font-family="Georgia" font-size="19" font-weight="700" fill="#102033">AW</text>
<text x="700" y="287" text-anchor="middle" font-family="Inter" font-size="12" fill="#102033">hub</text>
<text x="70" y="72" font-family="Georgia" font-size="40" font-weight="700" fill="#faf7f0">Data model that does not lie</text>
<text x="72" y="110" font-family="Inter" font-size="18" fill="#b7c5d1">Only real intervals become timeline blocks. Scores and readiness become daily context.</text>
<g font-family="Inter" font-size="18" fill="#eef6ff">
  <rect x="135" y="185" width="250" height="110" rx="20" fill="#17324d" stroke="#8bd3ff"/>
  <text x="160" y="225" font-weight="700">Timeline blocks</text><text x="160" y="258" font-size="15">sleep · workouts · app usage</text>
  <rect x="135" y="335" width="250" height="110" rx="20" fill="#243b2e" stroke="#8fd19e"/>
  <text x="160" y="375" font-weight="700">Daily metrics</text><text x="160" y="408" font-size="15">recovery · HRV · strain</text>
  <rect x="1015" y="185" width="250" height="110" rx="20" fill="#4a3218" stroke="#d8b56d"/>
  <text x="1040" y="225" font-weight="700">Private raw data</text><text x="1040" y="258" font-size="15">exports · emails · tokens</text>
  <rect x="1015" y="335" width="250" height="110" rx="20" fill="#2e263d" stroke="#c9a7ff"/>
  <text x="1040" y="375" font-weight="700">Public materials</text><text x="1040" y="408" font-size="15">docs · templates · scripts</text>
</g>
<g stroke="#d8b56d" stroke-width="3" opacity=".8" fill="none"><path d="M390 240 C500 210 560 250 660 268"/><path d="M390 390 C500 390 565 320 666 285"/><path d="M1010 240 C900 210 840 250 740 268"/><path d="M1010 390 C900 390 835 320 734 285"/></g>
</svg>
