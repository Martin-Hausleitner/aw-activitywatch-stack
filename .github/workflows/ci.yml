name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check zsh scripts parse
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
          zsh -n scripts/*.sh
      - name: Check Python syntax
        run: python -m py_compile scripts/*.py
      - name: Validate example OpenClaw ingestion config
        run: python scripts/validate-openclaw-ingestion-config.py config/openclaw-ingestion.example.json
      - name: Secret scan
        run: python scripts/secret-scan.py
